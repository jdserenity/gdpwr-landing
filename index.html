<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Good Power Infinity, So that Evil May Be a Solved Problem, Inc." />
  <title>Good Power Infinity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="field" aria-hidden="true">
    <div class="field__grain"></div>
    <div class="field__beam"></div>
    <div class="field__horizon"></div>
  </div>

  <main class="scene">
    <div class="hero">
      <h1 class="brand">
        <span class="brand__line">Good Power</span>
        <span class="brand__line brand__line--infinity">Infinity</span>
      </h1>
      <div class="globe-block">
        <div class="globe" aria-hidden="true">
          <div class="globe__sphere"></div>
        </div>
        <p class="ticker">$GPI 5T</p>
      </div>
    </div>
    <div class="titles">
      <p class="seal">Good Power Infinity, So that Evil May Be a Solved Problem, Inc.</p>
      <p class="byline">By Jd Diamari</p>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
